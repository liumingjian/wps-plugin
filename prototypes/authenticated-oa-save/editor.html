<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Authenticated OA Save Probe</title>
  <style>
    html, body { height: 100%; margin: 0; font: 14px/1.5 sans-serif; color: #17202a; }
    body { display: grid; grid-template-rows: 48px minmax(0, 1fr) 180px; }
    header { display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid #ccd3dc; }
    #status { font-weight: 600; }
    #status[data-kind="error"] { color: #b42318; }
    #status[data-kind="ok"] { color: #137333; }
    object { width: 100%; height: 100%; display: block; }
    pre { box-sizing: border-box; margin: 0; padding: 12px 16px; overflow: auto; border-top: 1px solid #ccd3dc; background: #f5f7f9; }
  </style>
</head>
<body>
  <header>
    <strong id="case-name">PROTOTYPE</strong>
    <span id="status" data-kind="warn">正在启动...</span>
  </header>
  <object id="webwps" type="application/x-wps" hiden_taskpane="true">
    <param name="Enabled" value="1">
  </object>
  <pre id="result">等待 WPS...</pre>
  <script src="editor.js"></script>
</body>
</html>
