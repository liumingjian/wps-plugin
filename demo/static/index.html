<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local WPS Editing Demo</title>
  <style>
    body { font: 16px system-ui; max-width: 44rem; margin: 4rem auto; padding: 0 1rem; color: #17202a; }
    .document { border: 1px solid #ccd1d1; border-radius: .6rem; padding: 1.5rem; }
    #document-preview { min-height: 8rem; padding: 1rem; background: #f7f9f9; white-space: pre-wrap; }
    .edit-entry { appearance: none; border: 0; border-radius: .4rem; padding: .7rem 1rem; background: #145a32; color: white; font-weight: 700; cursor: pointer; }
    .edit-entry:disabled { cursor: wait; opacity: .6; }
    [data-state="editing"] { color: #1f618d; } [data-state="succeeded"] { color: #196f3d; } [data-state="failed"] { color: #922b21; }
  </style>
</head>
<body>
  <h1>Document editing route</h1>
  <article class="document">
    <h2 id="document-name">Demo Document</h2>
    <p id="document-version">Loading current version…</p>
    <section aria-labelledby="preview-heading">
      <h3 id="preview-heading">Current document</h3>
      <div id="document-preview">Loading document preview…</div>
    </section>
    <button class="edit-entry" data-document-id="doc-001" type="button">Edit locally in WPS</button>
    <p id="task-status" role="status" aria-live="polite">Ready to edit the current document.</p>
  </article>
  <script src="app.js"></script>
</body>
</html>
